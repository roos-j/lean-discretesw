fidelity:
  divergences: >-
    (1) The kernel is a function on all of R^n and the identity K(x) = Omega(x) / |x|^n is
    required at every x, so Lean's convention a / 0 = 0 forces K(0) = 0 for n >= 1; the
    papers consider K only away from the origin. (2) The series runs over all y in Z^n rather
    than over y different from 0; by (1) the extra term vanishes. (3) The series is Mathlib's
    unconditional sum, which is 0 for non-summable families, so the theorem additionally
    asserts summability of the series for every modulation parameter and every x whenever f
    is in l^p. (4) The maximal operator takes values in [0, infinity], l^p(Z^n) is MemLp for
    counting measure, and the constant is a real number C entering as ENNReal.ofReal C.
    (5) The vanishing integral of Omega is taken with respect to Mathlib's surface measure
    volume.toSphere on the unit sphere. (6) The hypothesis n >= 1 is explicit; the papers
    assume n and d are positive integers. The proof follows the machine-generated blueprint
    rather than the papers line by line; its departures from the blueprint (changes of route,
    explicit constants, generalizations and Mathlib's Fourier sign convention) are listed in
    automation/ErrorReport.md and do not affect the statement.

